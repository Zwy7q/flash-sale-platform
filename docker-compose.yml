services:
  mysql:
    # 使用官方 MySQL 8 镜像，适合本地开发和学习。
    image: mysql:8.0.36
    container_name: flash-sale-mysql
    restart: unless-stopped
    environment:
      # 以下账号只用于本地开发，不要用于生产环境。
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: flash_sale
      TZ: Asia/Shanghai
    ports:
      # 左侧是 Windows 主机端口，右侧是容器内 MySQL 端口。
      # 本机 3306 已被已有 MySQL 占用，因此使用 3307 避免冲突。
      - "3307:3306"
    volumes:
      # 将数据库文件保存到 Docker volume，容器重启后数据不会丢失。
      - flash-sale-mysql-data:/var/lib/mysql
      # 初始化脚本会在数据库第一次创建时自动执行。
      - ./sql:/docker-entrypoint-initdb.d:ro

  redis:
    # Redis 是内存型键值数据库，后续用于商品缓存和秒杀库存。
    image: redis:7.2-alpine
    container_name: flash-sale-redis
    restart: unless-stopped
    ports:
      # Redis 容器内部默认使用 6379，主机也使用 6379。
      - "6379:6379"

  rabbitmq:
    # management 版本附带网页管理后台，便于观察队列和消息。
    image: rabbitmq:3.13-management
    container_name: flash-sale-rabbitmq
    hostname: flash-sale-rabbitmq
    restart: unless-stopped
    environment:
      # 仅用于本地教学；避免使用只能从容器内部连接的默认 guest 账号。
      RABBITMQ_DEFAULT_USER: flashsale
      RABBITMQ_DEFAULT_PASS: flashsale123456
    ports:
      # 5672 给 Java 连接；15672 给浏览器管理后台使用。
      - "5672:5672"
      - "15672:15672"
    volumes:
      - flash-sale-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  flash-sale-mysql-data:
  flash-sale-rabbitmq-data:
