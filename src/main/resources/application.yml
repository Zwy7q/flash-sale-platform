server:
  # 统一使用 8080 端口，后续 Vue 前端会请求这个端口。
  port: 8080

app:
  # 教学阶段使用固定管理员用户 ID，后续可升级为用户表 role 字段。
  admin-user-id: 1
  order:
    # 从订单 created_at 开始计时，默认 15 分钟内支付。
    payment-timeout-seconds: 900
    # 每轮最多处理 100 笔到期订单，并重试 100 笔未完成的 Redis 释放。
    timeout-scan-interval-ms: 60000
    timeout-enabled: true

spring:
  application:
    name: flash-sale-platform

  datasource:
    # 3307 是 Windows 主机端口，会转发到 MySQL 容器的 3306 端口。
    url: jdbc:mysql://localhost:3307/flash_sale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # Redis 在 Docker 中暴露到本机的 6379 端口。
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: flashsale
    password: flashsale123456
    # 默认虚拟主机，相当于 RabbitMQ 内的一套独立消息资源空间。
    virtual-host: /
    connection-timeout: 5s
    # 真实秒杀链路默认启用生产者确认和无法路由消息退回。
    publisher-confirm-type: correlated
    publisher-returns: true

  jwt:
    # 教学环境密钥。生产环境必须通过环境变量或密钥管理服务注入。
    secret: flash-sale-demo-secret-key-change-in-production
    expire-seconds: 7200
